[package]
name = "rsomics-minimap2"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/omics-rust/rsomics-world"
authors = ["Zane Leong <efd@live.com>"]
description = "Long/short-read aligner — CLI wrapper of minimap2 FFI bindings (Quadrant ②)"

[[bin]]
name = "rsomics-minimap2"
path = "src/main.rs"


[lib]
name = "rsomics_minimap2"
path = "src/lib.rs"
doctest = false
[dependencies]
rsomics-common = { version = "0.6" }
rsomics-help = { version = "0.3" }
clap = { version = "4", features = ["derive"] }
minimap2 = "0.1"

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
[[bench]]
name = "bench"
harness = false
